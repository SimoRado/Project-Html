<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/products.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/enhancements.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="menu-logo" id="menu-logo">
            <img src="../assets/menuBlack.png" alt="">
            <h4>Menu</h4>
        </div>
        <nav>
            <h4>Logo</h4>
        </nav>
        <a href="#" ><button class="nav_btn">Contact</button></a>
        <div class="menu" id="menu">
            <button class="close-btn" id="close-btn" ><img src="../assets/closeBlack.png" alt=""></button>
            <div class="side-list">
                <button onclick="afficherContact()">Voir Contact</button>




                <ul>
                    <li><a href="index.html"> Home<img src="../assets/rightarrow.png" alt=""> </a></li>
                    <li><a href="dashboard.html"> Dashboard<img src="../assets/rightarrow.png" alt=""> </a></li>
                    <li><a href="allproduct.html"> All Cars <img src="../assets/rightarrow.png" alt=""> </a></li>
                    <li><a href="rentals.html"> Rentals <img src="../assets/rightarrow.png" alt=""> </a></li>
                    <li><a href="reviews.html"> Reviews <img src="../assets/rightarrow.png" alt=""> </a></li>
                </ul>
            </div>
        </div>
    </header>
    <main id="main">
        <div class="filter-bar">
            <h1>Filter Bar</h1>
            <div class="filter-list">
                <div class="filter-item">
                    <label for="brand-select">Brand:</label>
                    <select name="" id="brand-select">
                         <option value="none"> Select a Brand</option>
                        <option value="Porshe"> Porshe</option>
                        <option value="Bmw"> Bmw</option>
                        <option value="Ferrari"> Ferrari</option>
                        <option value="Ferrari"> Dacia</option>
                        <option value="Ferrari"> Renault</option>
                        <option value="Ferrari"> peugeot</option>
                        <option value="Ferrari"> volkswagen</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="status-select">Status:</label>
                    <select name="" id="status-select">
                        <option value="none"> Select a status</option>
                        <option value="Rental"> Rentals</option>
                        <option value="Buy"> Buy</option>
                        <option value="Rental/Buy"> Rantal/Buy</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="price-range">Price range:</label>
                    <div id="price-range">
                        <input type="number" name="" placeholder="from  x MAD" id="min-price">
                        <input type="number" name="" placeholder="to x MAD" id="max-price">
                    </div>
                </div>
            </div>
            <button class="filter-btn" id="search-btn" onclick="filter()"> Search </button>
            <button class="filter-btn" id="reset-btn" onclick="reset()"> Reset </button>
        </div>
        <div class="product-list" id="product-list">
            
        </div>

        <dialog class="modal" id="modal">
            <div class="container" id="info-container">
               
            </div>
            <div class="container" id="form-container">
                <h1>Add a car</h1>
                <div class="close-btn">
                  <button onclick="removeForm()" ><img src="../assets/closeBlack.png" alt=""></button>
                </div>
                <form id="add-car-form" method="dialog">
                    <div>
                        <button id="add-btn" type="submit">Add car</button>
                    </div>
                    <div>
                        <label for="name">Name :</label>
                        <input type="text" name="" id="name" required>
                    </div>
                    <div>
                        <label for="price">Price :</label>
                        <input type="number" id="price" required>
                    </div>
                    <div>
                        <label for="add-brand-select">Brand :</label>
                        <select name="" id="add-brand-select" required>
                            <option value=""> Select a Brand</option>
                            <option value="Porshe"> Porshe</option>
                        <option value="Bmw"> Bmw</option>
                        <option value="Ferrari"> Ferrari</option>
                        <option value="Ferrari"> Dacia</option>
                        <option value="Ferrari"> Renault</option>
                        <option value="Ferrari"> peugeot</option>
                        <option value="Ferrari"> volkswagen</option>
                        </select>
                    </div>
                    <div>
                        <label for="status-select">Status :</label>
                        <select name="" id="add-status-select" required>
                            <option value=""> Select a status</option>
                            <option value="Rental"> Rent</option>
                            <option value="Buy"> Buy</option>
                            <option value="Rental/Buy"> Rent/Buy</option>
                        </select>
                    </div>
                    <div>
                        <label for="details">Details about the car :</label>
                        <textarea name="" id="details"></textarea>
                    </div>
                    <div>
                        <label for="img">Image</label>
                        <input type="file" name="" id="img" accept=".png, .webp">
                    </div>
                    
                </form>
            </div>
        </dialog>
        <!-- <div class="test">

        </div> -->
    </main>
    

    <script src="../js/index.js"></script>
    <script src="../js/classes.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
