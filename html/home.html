<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/products.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="menu-logo" id="menu-logo">
            <img src="../assets/menuBlack.png" alt="">
            <h4>Menu</h4>
        </div>
        <nav>
            <h4>Logo</h4>
        </nav>
        <a href="#" ><button class="nav_btn">Contact</button></a>
        <div class="menu" id="menu">
            <button class="close-btn" id="close-btn" ><img src="../assets/closeBlack.png" alt=""></button>
            <div class="side-list">
                <ul>
                    <li>Home<img src="../assets/rightarrow.png" alt=""></li>
                    <li>Rentals <img src="../assets/rightarrow.png" alt=""></li>
                    <li>For Sale <img src="../assets/rightarrow.png" alt=""></li>
                    <li><img src="../assets/rightarrow.png" alt=""></li>
                </ul>
            </div>
        </div>
    </header>
    <main id="main">
        <div class="filter-bar">
            <div class="filter-list">
                <div class="filter-item">
                    <label for="brand-select">Brand:</label>
                    <select name="" id="brand-select">
                        <option value=""> Select a Brand</option>
                        <option value=""> Brand 1</option>
                        <option value=""> Brand 2</option>
                        <option value=""> Brand 3</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label for="price-range">Price range:</label>
                    <div id="price-range">
                        <input type="number" name="" placeholder="from  x$" id="min-price">
                        <input type="number" name="" placeholder="to x$" id="max-price">
                    </div>
                </div>
            </div>
        </div>
        <div class="product-list" id="product-list">
            
        </div>
        <div  id="add-car-modal"> 
            <div class="container">
                <h1>Add a car</h1>
                <div class="close-btn">
                  <button onclick="removeForm()" ><img src="../assets/closeBlack.png" alt=""></button>
                </div>
                <form id="add-car-form">
                    <div>
                        <label for="name">Name :</label>
                        <input type="text" name="" id="name" required>
                    </div>
                    <div>
                        <label for="price">Price :</label>
                        <input type="number" id="price" required>
                    </div>
                    <div>
                        <label for="add-brand-select">Brand :</label>
                        <select name="" id="add-brand-select" required>
                            <option value=""> Select a Brand</option>
                            <option value="Porshe"> Porshe</option>
                            <option value="Bmw"> Bmw</option>
                            <option value="Ferrari"> Ferrari</option>
                        </select>
                    </div>
                    <div>
                        <label for="status-select">Status :</label>
                        <select name="" id="status-select" required>
                            <option value=""> Select a status</option>
                            <option value="rent"> Rent</option>
                            <option value="buy"> Buy</option>
                            <option value="rent/buy"> Rent/Buy</option>
                        </select>
                    </div>
                    <div>
                        <label for="details">Details about the car :</label>
                        <textarea name="" id="details"></textarea>
                    </div>
                    <div>
                        <label for="img">Image</label>
                        <input type="file" name="" id="img" accept=".png, .webp">
                    </div>
                    <div>
                        <button id="add-btn">Add car</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- <div class="test">

        </div> -->
    </main>
    

    <script src="../js/index.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/test.js"></script>
</body>
</html>
